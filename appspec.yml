version: 0.0
os: linux
files:
  - source: /backend/target/cloudtask-backend-1.0.0.jar
    destination: /opt/cloudtask/backend
  - source: /frontend/dist
    destination: /var/www/cloudtask/html
hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 30
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root
