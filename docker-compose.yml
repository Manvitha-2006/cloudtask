version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cloudtask-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-cloudtask_db}
      MYSQL_USER: ${DB_USERNAME:-clouduser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cloudpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudtask-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cloudtask_db}
      DB_USERNAME: ${DB_USERNAME:-clouduser}
      DB_PASSWORD: ${DB_PASSWORD:-cloudpass}
      JWT_SECRET: ${JWT_SECRET:-CloudTaskSecretKeyForJWTSigningAndAuthMustBeAtLeast256BitsLong!}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudtask-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
