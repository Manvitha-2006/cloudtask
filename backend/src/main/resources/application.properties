# ===================================================================
# CloudTask Spring Boot Application Configuration
# AWS CI/CD Pipeline with Blue-Green Deployment Ready
# ===================================================================

server.port=8080

# Application Name
spring.application.name=cloudtask-backend

# MySQL Database Configuration using Environment Variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloudtask_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Secret & Expiration Configuration
jwt.secret=${JWT_SECRET:CloudTaskSecretKeyForJWTSigningAndAuthMustBeAtLeast256BitsLong!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Logging
logging.level.com.cloudtask=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
